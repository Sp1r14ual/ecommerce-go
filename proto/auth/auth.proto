syntax = "proto3";

// Это пакет внутри protobuf
package auth;

// Это путь, куда сгенерируется Go код. 
// Он совпадает с именем твоего модуля (ecommerce-go)
option go_package = "ecommerce-go/proto/auth;auth";

// Сам сервис
service AuthService {
  // Ручка регистрации
  rpc Register (RegisterRequest) returns (RegisterResponse);
  
  // Ручка логина
  rpc Login (LoginRequest) returns (LoginResponse);
}

// Запрос на регистрацию
message RegisterRequest {
  string email = 1;
  string password = 2;
}

// Ответ на регистрацию
message RegisterResponse {
  int64 user_id = 1;      // Возвращаем ID созданного пользователя
}

// Запрос на логин
message LoginRequest {
  string email = 1;
  string password = 2;
}

// Ответ при успешном логине
message LoginResponse {
  string access_token = 1; // Возвращаем JWT токен
}