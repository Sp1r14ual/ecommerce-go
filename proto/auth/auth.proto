syntax = "proto3";

// Это пакет внутри protobuf
package auth;

// Это путь, куда сгенерируется Go код. 
// Он совпадает с именем твоего модуля (ecommerce-go)
option go_package = "ecommerce-go/proto/auth;auth";

// Сам сервис
service AuthService {
  // Ручка регистрации
  rpc Register (RegisterRequest) returns (RegisterResponse);
  
  // Ручка логина
  rpc Login (LoginRequest) returns (LoginResponse);

  // Помещает токен в черный список
  rpc Logout (LogoutRequest) returns (LogoutResponse);
  
  // Проверяет токен (ипользуется шлюзом перед выполнением других запросов)
  rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse);
}

// Запрос на регистрацию
message RegisterRequest {
  string email = 1;
  string password = 2;
}

// Ответ на регистрацию
message RegisterResponse {
  int64 user_id = 1;      // Возвращаем ID созданного пользователя
}

// Запрос на логин
message LoginRequest {
  string email = 1;
  string password = 2;
}

// Ответ при успешном логине
message LoginResponse {
  string access_token = 1; // Возвращаем JWT токен
}

message LogoutRequest {
  string access_token = 1;
}

message LogoutResponse {
  bool success = 1;
}

message ValidateTokenRequest {
  string access_token = 1;
}

message ValidateTokenResponse {
  bool is_valid = 1;
  int64 user_id = 2; // Возвращаем ID юзера, чтобы шлюз знал, КТО делает заказ!
}