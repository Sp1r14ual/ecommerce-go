services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 2s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
  
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  
  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # Важно: говорим нашим Go-сервисам обращаться по имени 'kafka'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  
  # Этот контейнер просто создаст топик "orders" и завершит работу (Exited)
  kafka-setup:
    image: apache/kafka:latest
    depends_on:
      - kafka
    # Крутимся в цикле, пока Кафка не ответит, затем создаем топик!
    command: >
      bash -c "
        echo 'Wait for Kafka to be ready...'
        for i in {1..30}; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list > /dev/null 2>&1 && break || sleep 2;
        done;
        echo 'Kafka is ready. Creating topic...'
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders --replication-factor 1 --partitions 1
        echo 'Setup complete!'
      "

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # Порт для красивого Web-интерфейса
      - "4317:4317"   # Порт (gRPC) куда сервисы будут слать логи

  auth-service:
    build: 
      context: .
      dockerfile: auth-service/Dockerfile
    ports:
      - "50051:50051"
    environment:
      DATABASE_URL: "postgres://auth_user:auth_password@postgres:5432/auth_db?sslmode=disable"
      REDIS_ADDR: "redis:6379"
    depends_on:
      postgres:
        condition: service_healthy

  goods-service:
    build:
      context: .
      dockerfile: goods-service/Dockerfile
    ports:
      - "50052:50052"
    environment:
      MONGO_URI: "mongodb://mongodb:27017"
    depends_on:
      - mongodb

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    ports:
      - "50053:50053"
    environment:
      DATABASE_URL: "postgres://auth_user:auth_password@postgres:5432/auth_db?sslmode=disable"
      GOODS_SERVICE_ADDR: "goods-service:50052"
      PAYMENT_SERVICE_ADDR: "payment-service:50054"
      KAFKA_ADDR: "kafka:9092"
      JAEGER_ADDR: "jaeger:4317" 
    depends_on:
      postgres:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully # Ждем успешного завершения скрипта
      goods-service:
        condition: service_started # для обычных сервисов оставляем started (эквивалент старого синтаксиса)
      payment-service:
        condition: service_started
  
  notify-service:
    build:
      context: .
      dockerfile: notify-service/Dockerfile
    environment:
      KAFKA_ADDR: "kafka:9092"
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
  
  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    ports:
      - "50054:50054"

  delivery-service:
    build:
      context: .
      dockerfile: delivery-service/Dockerfile
    environment:
      KAFKA_ADDR: "kafka:9092"
    depends_on:
      kafka-setup:
        condition: service_completed_successfully

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_ADDR: "auth-service:50051"
      GOODS_SERVICE_ADDR: "goods-service:50052" 
      ORDER_SERVICE_ADDR: "order-service:50053"
      JAEGER_ADDR: "jaeger:4317"
    depends_on:
      - auth-service
      - goods-service
      - order-service
      - jaeger

volumes:
  pgdata:
  mongodata: