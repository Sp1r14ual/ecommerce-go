services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
  
  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # Важно: говорим нашим Go-сервисам обращаться по имени 'kafka'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  auth-service:
    build: 
      context: .
      dockerfile: auth-service/Dockerfile
    ports:
      - "50051:50051"
    environment:
      DATABASE_URL: "postgres://auth_user:auth_password@postgres:5432/auth_db?sslmode=disable"
    depends_on:
      - postgres

  goods-service:
    build:
      context: .
      dockerfile: goods-service/Dockerfile
    ports:
      - "50052:50052"
    environment:
      MONGO_URI: "mongodb://mongodb:27017"
    depends_on:
      - mongodb

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    ports:
      - "50053:50053"
    environment:
      DATABASE_URL: "postgres://auth_user:auth_password@postgres:5432/auth_db?sslmode=disable"
      GOODS_SERVICE_ADDR: "goods-service:50052"
      KAFKA_ADDR: "kafka:9092"
    depends_on:
      - postgres
      - goods-service
      - kafka
  
  notify-service:
    build:
      context: .
      dockerfile: notify-service/Dockerfile
    environment:
      KAFKA_ADDR: "kafka:9092"
    depends_on:
      - kafka

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_ADDR: "auth-service:50051"
      GOODS_SERVICE_ADDR: "goods-service:50052" 
      ORDER_SERVICE_ADDR: "order-service:50053"
    depends_on:
      - auth-service
      - goods-service
      - order-service

volumes:
  pgdata:
  mongodata: